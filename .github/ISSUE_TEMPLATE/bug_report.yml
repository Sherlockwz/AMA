name: Bug report
description: Report a reproducible problem in AMA or its OpenClaw integration.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Remove API keys, private conversations, database contents, and provider logs before submitting."
  - type: textarea
    id: summary
    attributes:
      label: Problem
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Include the smallest safe sequence of commands or code that reproduces the issue.
      render: shell
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: AMA version or commit
      placeholder: v0.1.0 or commit SHA
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: macOS 15, Node 24.15, Python 3.11, OpenClaw 2026.7.1-2
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs
      description: Paste only logs that contain no credentials or user memory.
      render: text
  - type: checkboxes
    id: checks
    attributes:
      label: Safety checks
      options:
        - label: I removed secrets, personal data, and private memory content.
          required: true
        - label: I searched existing issues.
          required: true
